services:
  postgres:
    image: postgres:17-alpine
    container_name: court-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: court_booking
      POSTGRES_USER: court
      POSTGRES_PASSWORD: court_dev_password
    ports:
      # Host 5433 -> contenedor 5432.
      # El 5432 del host lo ocupa el PostgreSQL 17 instalado en Windows.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U court -d court_booking"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
