name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Solo lectura del repositorio: el workflow no publica nada.
permissions:
  contents: read

# Si llegan varios push seguidos a la misma rama, cancela los anteriores en
# lugar de gastar minutos en revisiones que ya no interesan.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Reutiliza ~/.m2 entre ejecuciones. Sin esto cada build vuelve a
          # descargar todas las dependencias de Spring Boot.
          cache: maven

      # Los tests levantan Postgres con Testcontainers. No hay que instalar
      # nada: los runners de ubuntu traen Docker, y por eso no se declara un
      # service container de GitHub Actions; lo gestiona Testcontainers.
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      # Cuando algo falla en CI, el log no siempre basta: los informes de
      # Surefire traen la traza completa de cada test.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
