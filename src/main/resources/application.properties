spring.application.name=court-booking

# --- Base de datos ---------------------------------------------------------
# Puerto 5433: el 5432 del host lo ocupa el PostgreSQL 17 nativo de Windows.
# Todo con valor por defecto, para que el proyecto arranque sin configurar nada
# pero se pueda sobreescribir por entorno en despliegue.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:court_booking}
spring.datasource.username=${DB_USER:court}
spring.datasource.password=${DB_PASSWORD:court_dev_password}

# --- JPA -------------------------------------------------------------------
# 'validate': Hibernate comprueba que las entidades cuadran con el esquema,
# pero no lo modifica nunca. El duenyo del esquema es Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ----------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Logs -------------------------------------------------------------------
logging.level.org.hibernate.SQL=debug

# --- Zona horaria -----------------------------------------------------------
# NO activar hibernate.jdbc.time_zone: afecta tambien a las columnas SIN zona
# (time, timestamp) y desplaza sus valores segun la zona de la JVM. Las
# opening_hours son 'time' y saldrian corridas una hora.
# No hace falta: todas las columnas de instante son timestamptz mapeadas a
# Instant, y para esas el driver ya conserva el instante absoluto.

# Zona del club. TODA conversion entre hora local (opening_hours, que son
# 'time' sin zona) e instantes absolutos (bookings) debe usar esta zona
# explicitamente, nunca ZoneId.systemDefault().
app.club.timezone=Europe/Madrid
